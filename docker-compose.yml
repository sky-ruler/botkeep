services:
  botkeep:
    build:
      context: .
      dockerfile: Dockerfile
    image: botkeep:latest
    container_name: botkeep-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/botkeep.db
    volumes:
      - botkeep-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  botkeep-data:
    driver: local
