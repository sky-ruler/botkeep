name: Release Build & Multi-Architecture Distribution

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-matrix:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output_name: botkeep-linux-amd64
          - goos: linux
            goarch: arm64
            output_name: botkeep-linux-arm64
          - goos: linux
            goarch: arm
            goarm: '7'
            output_name: botkeep-linux-armv7
          - goos: darwin
            goarch: amd64
            output_name: botkeep-darwin-amd64
          - goos: darwin
            goarch: arm64
            output_name: botkeep-darwin-arm64
          - goos: windows
            goarch: amd64
            output_name: botkeep-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Build Tools
        run: |
          npm ci
          go install github.com/a-h/templ/cmd/templ@v0.3.833

      - name: Compile CSS & Templates
        run: |
          npm run build:css
          templ generate

      - name: Run Tests
        run: go test ./...

      - name: Build Binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p bin
          TAG_NAME="${{ github.ref_name }}"
          GIT_COMMIT="$(git rev-parse --short HEAD)"
          go build -ldflags="-s -w -X main.version=${TAG_NAME#v} -X main.commit=${GIT_COMMIT}" -o bin/${{ matrix.output_name }} ./cmd/server

      - name: Generate Checksum
        run: |
          cd bin
          sha256sum ${{ matrix.output_name }} > ${{ matrix.output_name }}.sha256

      - name: Upload Single Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: bin/*

  publish-github-release:
    name: Publish GitHub Release
    needs: release-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Aggregate SHA256SUMS
        run: |
          cd release-assets
          sha256sum botkeep-* > SHA256SUMS || true
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BotKeep Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
            install.sh
            fleet.yaml
